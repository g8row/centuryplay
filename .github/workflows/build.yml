name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK; only the NDK/CMake for the ALAC encoder are added.
      - name: Install NDK and CMake (ALAC encoder)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: centuryplay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
